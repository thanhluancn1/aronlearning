<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OctoKids - Cổng Game Toán Học & Nền Tảng Luyện Thi Trắc Nghiệm</title>
  <meta name="description" content="Hệ thống Cổng Web Game Giáo Dục Toán Học Tiền Tiểu Học & Nền tảng Luyện thi Trắc nghiệm Toán TIMO dành cho trẻ mầm non & tiểu học.">
  
  <!-- Google Fonts: Be Vietnam Pro & Inter for ultra-sharp typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800;900&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Be Vietnam Pro"', 'Inter', 'system-ui', 'sans-serif'],
          },
          animation: {
            bounceSlow: 'bounce 2.5s infinite',
            float: 'float 3s ease-in-out infinite',
            pulseSlow: 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            }
          }
        }
      }
    }
  </script>

  <!-- Alpine.js v3 CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Core Modules & UI Components -->
  <script src="assets/js/i18n/i18n.js"></script>
  <script src="assets/js/core/audio.js"></script>
  <script src="assets/js/core/class-manager.js"></script>
  <script src="assets/js/core/student-auth.js"></script>
  <script src="assets/js/core/student-profile.js"></script>
  <script src="assets/js/core/tryhard-engine.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/ui/notification.js"></script>
  <script src="assets/js/ui/auth-modal.js"></script>

  <style>
    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    body {
      user-select: none;
      -webkit-user-select: none;
      background-color: #f1f5f9;
      font-family: 'Be Vietnam Pro', 'Inter', system-ui, sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900 antialiased flex flex-col justify-between" x-data="portalHubApp()">

  <!-- 1. OCTOKIDS BRAND NAVBAR HEADER (FULL WIDTH) -->
  <nav class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-40 px-4 sm:px-8 py-3">
    <div class="w-full flex justify-between items-center gap-4">
      
      <!-- Brand & Navigation Links -->
      <div class="flex items-center gap-4 sm:gap-8">
        <a href="index.html" class="flex items-center gap-2.5 font-black text-2xl text-purple-700 tracking-tight hover:opacity-90 transition-opacity">
          <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-600 text-white flex items-center justify-center text-2xl shadow-md">
            🐙
          </div>
          <span class="hidden sm:inline font-black">OctoKids</span>
        </a>

        <!-- Nav Category Links -->
        <div class="hidden md:flex items-center gap-1.5 text-sm font-bold text-slate-700">
          <a href="index.html" class="px-3.5 py-2 rounded-xl bg-purple-50 text-purple-800 font-extrabold flex items-center gap-1.5">
            <span>🏠</span><span x-text="t('nav.home')"></span>
          </a>
          <a href="modules/luyen-thi-trac-nghiem.html" class="px-3.5 py-2 rounded-xl hover:bg-slate-100 flex items-center gap-1.5 transition-colors">
            <span>🏆</span><span x-text="t('nav.olympic')"></span>
          </a>
          <a href="#" class="px-3.5 py-2 rounded-xl hover:bg-slate-100 flex items-center gap-1.5 transition-colors">
            <span>🌐</span><span x-text="t('nav.engMath')"></span>
          </a>
          <a href="#" class="px-3.5 py-2 rounded-xl hover:bg-slate-100 flex items-center gap-1.5 transition-colors">
            <span>💡</span><span x-text="t('nav.iqMath')"></span>
          </a>
        </div>
      </div>

      <!-- User Controls & Global Stats -->
      <div class="flex items-center gap-3">
        
        <!-- Class Switcher Dropdown -->
        <div class="relative" x-data="{ openClass: false }">
          <button @click="openClass = !openClass" 
                  class="bg-indigo-50 hover:bg-indigo-100 border border-indigo-300 text-indigo-900 px-3.5 py-1.5 rounded-2xl font-black text-xs sm:text-sm flex items-center gap-1.5 shadow-sm active:scale-95 transition-all cursor-pointer"
                  title="Chuyển lớp học">
            <span class="text-base" x-text="getActiveClassIcon()"></span>
            <span class="max-w-[110px] sm:max-w-[150px] truncate font-black" x-text="getActiveClassName()"></span>
            <span class="text-[10px] ml-0.5">▼</span>
          </button>
          
          <div x-show="openClass" 
               @click.outside="openClass = false" 
               x-transition
               class="absolute right-0 mt-2 w-60 bg-white border border-slate-200 rounded-2xl shadow-xl z-50 py-1.5 overflow-hidden">
            <div class="px-3.5 py-1.5 text-[10px] font-black text-slate-400 uppercase tracking-wider border-b border-slate-100">
              Lớp học của bé 🏫
            </div>
            <template x-for="cls in getAvailableClassesForStudent()" :key="cls.id">
              <button @click="switchClass(cls.id); openClass = false;" 
                      class="w-full text-left px-3.5 py-2 hover:bg-indigo-50 flex items-center gap-2.5 font-extrabold text-xs sm:text-sm transition-colors cursor-pointer"
                      :class="activeClassId === cls.id ? 'text-indigo-700 bg-indigo-50/80 font-black' : 'text-slate-700'">
                <span class="text-lg" x-text="cls.icon"></span>
                <div class="flex-1 min-w-0">
                  <div class="truncate leading-tight font-black" x-text="getLocalized(cls.name)"></div>
                  <div class="text-[10px] font-bold text-slate-400" x-text="cls.id"></div>
                </div>
                <span x-show="activeClassId === cls.id" class="text-indigo-600 font-black text-base">✓</span>
              </button>
            </template>
          </div>
        </div>

        <!-- Language Switcher Dropdown -->
        <div class="relative" x-data="{ open: false }">
          <button @click="open = !open" 
                  class="bg-purple-50 hover:bg-purple-100 border border-purple-300 text-purple-800 px-3.5 py-1.5 rounded-2xl font-black text-xs sm:text-sm flex items-center gap-1.5 shadow-sm active:scale-95 transition-all">
            <span class="text-base" x-text="getCurrentLangFlag()"></span>
            <span x-text="getCurrentLangLabel()"></span>
            <span class="text-[10px] ml-0.5">▼</span>
          </button>
          
          <div x-show="open" 
               @click.outside="open = false" 
               x-transition
               class="absolute right-0 mt-2 w-44 bg-white border border-slate-200 rounded-2xl shadow-xl z-50 py-1.5 overflow-hidden">
            <template x-for="langItem in languages" :key="langItem.code">
              <button @click="setLang(langItem.code); open = false;" 
                      class="w-full text-left px-4 py-2 hover:bg-purple-50 flex items-center gap-2.5 font-extrabold text-xs sm:text-sm transition-colors"
                      :class="currentLang === langItem.code ? 'text-purple-700 bg-purple-50 font-black' : 'text-slate-700'">
                <span class="text-lg" x-text="langItem.flag"></span>
                <span x-text="langItem.label"></span>
                <span x-show="currentLang === langItem.code" class="ml-auto text-purple-600 font-black">✓</span>
              </button>
            </template>
          </div>
        </div>

        <!-- Player Badge / Login Button -->
        <button 
          @click="openProfileModal()"
          class="bg-slate-50 border border-slate-300 hover:border-purple-400 px-3.5 py-1.5 rounded-2xl font-black flex items-center gap-2 shadow-sm transition-all text-xs sm:text-sm text-slate-900 active:scale-95 cursor-pointer"
          :title="state.student ? `${state.student.fullName} (${state.student.age} tuổi)` : 'Nhấp để đăng nhập'">
          <span class="text-xl" x-text="state.avatar || '👦'"></span>
          <span class="font-black hidden sm:inline text-slate-900" x-text="state.student ? state.student.fullName : t('auth.notLoggedIn', 'Chưa đăng nhập')"></span>
        </button>

      </div>

    </div>
  </nav>

  <!-- 2. OCTOKIDS CURRICULUM SECTIONS (FULL WIDTH) -->
  <main class="w-full px-4 sm:px-8 py-8 flex-1">

    <!-- A. LOADING SPINNER -->
    <div x-show="isLoadingCurriculum && !loadError" class="w-full flex flex-col items-center justify-center py-24 text-center">
      <div class="w-14 h-14 border-4 border-purple-200 border-t-purple-600 rounded-full animate-spin mb-4"></div>
      <p class="text-purple-800 font-black text-base">Đang tải danh mục chương trình học...</p>
      <p class="text-slate-500 font-bold text-xs mt-1">Vui lòng chờ trong giây lát</p>
    </div>

    <!-- B. ERROR STATE CARD (POWERED BY REUSABLE OCTONOTIFY MODULE) -->
    <div x-show="loadError" x-html="renderErrorState()" class="max-w-3xl mx-auto py-8"></div>

    <!-- C. MAIN CURRICULUM CONTENT -->
    <div x-show="!isLoadingCurriculum && !loadError" class="space-y-8">

      <!-- PHÂN KHU 1: TƯ DUY NỀN TẢNG (Foundational Path) -->
    <section class="ok-curriculum-section">
      <div class="bg-white rounded-3xl p-6 sm:p-8 border-2 border-slate-200 shadow-md">
        
        <!-- Section Header -->
        <div class="flex items-center gap-3.5 mb-5 pb-4 border-b border-slate-100">
          <div class="w-12 h-12 rounded-2xl bg-amber-100 border-2 border-amber-300 flex items-center justify-center text-2xl shadow-sm">
            🌱
          </div>
          <div>
            <h3 class="text-xl sm:text-2xl font-black text-slate-950" x-text="t('curriculum.foundationalTitle')"></h3>
          </div>
        </div>

        <!-- Stepper Roadmap with Scroll Arrows -->
        <div class="relative">
          
          <button type="button" 
                  @click="$refs.pathScroll.scrollBy({ left: -280, behavior: 'smooth' })"
                  class="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-3 sm:-translate-x-4 z-20 w-11 h-11 rounded-full bg-white border-2 border-purple-400 shadow-lg text-purple-800 font-black text-2xl flex items-center justify-center hover:bg-purple-100 hover:scale-110 active:scale-95 transition-all">
            ‹
          </button>

          <!-- Horizontal Scroll Track -->
          <div x-ref="pathScroll" class="flex items-stretch gap-5 overflow-x-auto py-3 px-2 scroll-smooth no-scrollbar">
            <template x-for="(item, index) in sortedFoundational" :key="item.id">
              <div class="min-w-[250px] sm:min-w-[270px] rounded-3xl p-5 flex flex-col justify-between items-center text-center relative group transition-all"
                   :class="(getExamStatus(item.id)?.status === 'completed') ? 'bg-gradient-to-b from-emerald-50 via-white to-emerald-50/30 border-4 border-emerald-400 shadow-md hover:scale-[1.02]' : ((index === 0) ? 'bg-gradient-to-b from-purple-50 via-white to-purple-50/40 border-4 border-purple-500 shadow-lg hover:scale-[1.02]' : 'bg-white border-2 border-slate-200 shadow-sm hover:border-purple-300 hover:scale-[1.01]')">
                
                <!-- Status Badge (Top Right) -->
                <template x-if="getExamStatus(item.id)?.status === 'completed'">
                  <span class="absolute top-3.5 right-3.5 bg-emerald-100 text-emerald-800 border border-emerald-300 px-2.5 py-0.5 rounded-full text-[11px] font-black shadow-sm flex items-center gap-1">
                    <span x-text="getExamStatus(item.id)?.medal === 'gold' ? '🥇' : (getExamStatus(item.id)?.medal === 'silver' ? '🥈' : '🥉')"></span>
                    <span x-text="`${getExamStatus(item.id)?.score}đ`"></span>
                  </span>
                </template>
                <template x-if="getExamStatus(item.id)?.status === 'processing'">
                  <span class="absolute top-3.5 right-3.5 bg-amber-100 text-amber-900 border border-amber-300 px-2 py-0.5 rounded-full text-[10px] font-black shadow-sm flex items-center gap-1">
                    <span>⏳</span> <span>Đang làm</span>
                  </span>
                </template>

                <div class="w-9 h-9 rounded-full font-black text-sm flex items-center justify-center shadow-md mb-2"
                     :class="(getExamStatus(item.id)?.status === 'completed') ? 'bg-emerald-600 text-white' : ((index === 0) ? 'bg-purple-600 text-white' : 'bg-slate-200 text-slate-700')"
                     x-text="index + 1"></div>
                <div class="text-5xl my-2 group-hover:scale-110 transition-transform" x-text="item.icon"></div>
                <h4 class="font-black text-slate-950 text-base sm:text-lg my-1 leading-snug" x-text="getLocalized(item.title)"></h4>
                <span class="text-xs font-black px-3.5 py-1 rounded-full my-2"
                      :class="(getExamStatus(item.id)?.status === 'completed') ? 'text-emerald-800 bg-emerald-100 border border-emerald-300' : ((index === 0) ? 'text-purple-800 bg-purple-100 border border-purple-300' : 'text-slate-600 bg-slate-100 border border-slate-200')"
                      x-text="t('curriculum.questionsCount').replace('{count}', item.questionCount)"></span>
                <div class="grid grid-cols-2 gap-2 w-full mt-4">
                  <a :href="getExamUrl(item, 'explore')" @click="startExam(item, 'explore')" class="bg-white hover:bg-purple-50 text-purple-800 border-2 border-purple-300 font-black text-xs py-2.5 rounded-2xl text-center shadow-sm active:scale-95 transition-all" x-text="t('curriculum.exploreBtn')"></a>
                  <a :href="getExamUrl(item, 'practice')" @click="startExam(item, 'practice')" class="bg-purple-600 hover:bg-purple-700 text-white font-black text-xs py-2.5 rounded-2xl text-center shadow-md active:scale-95 transition-all" x-text="t('curriculum.practiceBtn')"></a>
                </div>
              </div>
            </template>
          </div>

          <button type="button" 
                  @click="$refs.pathScroll.scrollBy({ left: 280, behavior: 'smooth' })"
                  class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-3 sm:translate-x-4 z-20 w-11 h-11 rounded-full bg-white border-2 border-purple-400 shadow-lg text-purple-800 font-black text-2xl flex items-center justify-center hover:bg-purple-100 hover:scale-110 active:scale-95 transition-all">
            ›
          </button>

        </div>

      </div>
    </section>

    <!-- PHÂN KHU 2: TƯ DUY NÂNG CAO (Enrichment 6-Color Card Grid) -->
    <section class="ok-curriculum-section">
      <div class="bg-white rounded-3xl p-6 sm:p-8 border-2 border-slate-200 shadow-md">
        
        <!-- Section Header -->
        <div class="flex items-center gap-3.5 mb-6 pb-4 border-b border-slate-100">
          <div class="w-12 h-12 rounded-2xl bg-purple-100 border-2 border-purple-300 flex items-center justify-center text-2xl shadow-sm">
            🚀
          </div>
          <div>
            <h3 class="text-xl sm:text-2xl font-black text-slate-950" x-text="t('curriculum.enrichmentTitle')"></h3>
          </div>
        </div>

        <!-- Lesson Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          <template x-for="item in curriculum.enrichment" :key="item.id">
            <div class="border-2 rounded-3xl p-6 flex flex-col justify-between items-center text-center shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 group relative"
                 :class="getThemeClasses(item.colorTheme).card">
              
              <!-- Status Badge (Top Right) -->
              <template x-if="getExamStatus(item.id)?.status === 'completed'">
                <span class="absolute top-3.5 right-3.5 bg-emerald-100 text-emerald-800 border border-emerald-300 px-2.5 py-0.5 rounded-full text-[11px] font-black shadow-sm flex items-center gap-1">
                  <span x-text="getExamStatus(item.id)?.medal === 'gold' ? '🥇' : (getExamStatus(item.id)?.medal === 'silver' ? '🥈' : '🥉')"></span>
                  <span x-text="`${getExamStatus(item.id)?.score}đ`"></span>
                </span>
              </template>
              <template x-if="getExamStatus(item.id)?.status === 'processing'">
                <span class="absolute top-3.5 right-3.5 bg-amber-100 text-amber-900 border border-amber-300 px-2 py-0.5 rounded-full text-[10px] font-black shadow-sm flex items-center gap-1">
                  <span>⏳</span> <span>Đang làm</span>
                </span>
              </template>

              <h4 class="font-black text-slate-950 text-xl mb-2" x-text="getLocalized(item.title)"></h4>
              <div class="text-6xl my-3 group-hover:scale-110 transition-transform" x-text="item.icon"></div>
              <span class="text-xs font-black border px-3.5 py-1 rounded-full mb-5"
                    :class="getThemeClasses(item.colorTheme).badge"
                    x-text="t('curriculum.questionsCount').replace('{count}', item.questionCount)"></span>
              <div class="grid grid-cols-2 gap-2.5 w-full">
                <a :href="getExamUrl(item, 'explore')" @click="startExam(item, 'explore')" class="border-2 font-black text-xs py-2.5 rounded-2xl text-center shadow-sm active:scale-95 transition-all"
                   :class="getThemeClasses(item.colorTheme).exploreBtn"
                   x-text="t('curriculum.exploreBtn')"></a>
                <a :href="getExamUrl(item, 'practice')" @click="startExam(item, 'practice')" class="font-black text-xs py-2.5 rounded-2xl text-center shadow-md active:scale-95 transition-all text-white"
                   :class="getThemeClasses(item.colorTheme).practiceBtn"
                   x-text="t('curriculum.practiceBtn')"></a>
              </div>
            </div>
          </template>
        </div>
      </div>
    </section>

    <!-- PHÂN KHU 3: LUYỆN TẬP NHANH (Spiral Practice Mini Grid) -->
    <section class="ok-curriculum-section">
      <div class="bg-white rounded-3xl p-6 sm:p-8 border-2 border-slate-200 shadow-md">
        
        <!-- Section Header -->
        <div class="flex items-center gap-3.5 mb-6 pb-4 border-b border-slate-100">
          <div class="w-12 h-12 rounded-2xl bg-amber-100 border-2 border-amber-300 flex items-center justify-center text-2xl shadow-sm">
            ⚡
          </div>
          <div>
            <h3 class="text-xl sm:text-2xl font-black text-slate-950" x-text="t('curriculum.quickPracticeTitle')"></h3>
          </div>
        </div>

        <!-- 4 Quick Mini Grid Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <template x-for="item in curriculum.quickPractice" :key="item.id">
            <a :href="getExamUrl(item, 'practice')" 
               @click="startExam(item, 'practice')" 
               class="border-2 rounded-2xl p-4 flex items-center justify-between gap-3 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all group"
               :class="getQuickThemeClasses(item.colorTheme).card">
              <div class="flex items-center gap-3">
                <span class="w-11 h-11 rounded-2xl text-xl flex items-center justify-center shadow-sm flex-shrink-0"
                      :class="getQuickThemeClasses(item.colorTheme).iconBox"
                      x-text="item.icon"></span>
                <div class="flex flex-col">
                  <b class="font-black text-slate-950 text-base transition-colors"
                     :class="getQuickThemeClasses(item.colorTheme).title"
                     x-text="getLocalized(item.title)"></b>
                  <span class="text-xs font-bold text-slate-600" x-text="getQuickSubtitle(item)"></span>
                </div>
              </div>
              <div class="flex items-center gap-1.5 flex-shrink-0">
                <template x-if="getExamStatus(item.id)?.status === 'completed'">
                  <span class="bg-emerald-100 text-emerald-800 border border-emerald-300 px-2 py-0.5 rounded-full text-[10px] font-black shadow-sm flex items-center gap-0.5">
                    <span x-text="getExamStatus(item.id)?.medal === 'gold' ? '🥇' : (getExamStatus(item.id)?.medal === 'silver' ? '🥈' : '🥉')"></span>
                    <span x-text="`${getExamStatus(item.id)?.score}đ`"></span>
                  </span>
                </template>
                <template x-if="getExamStatus(item.id)?.status === 'processing'">
                  <span class="bg-amber-100 text-amber-900 border border-amber-300 px-1.5 py-0.5 rounded-full text-[10px] font-black">
                    ⏳
                  </span>
                </template>
                <span class="text-2xl font-black group-hover:translate-x-1 transition-transform"
                      :class="getQuickThemeClasses(item.colorTheme).arrow">›</span>
              </div>
            </a>
          </template>
        </div>
      </div>
    </section>

    </div>
  </main>



  <!-- Student Registration / Profile Modal được quản lý tự động bởi OctoAuthModal (assets/js/ui/auth-modal.js) -->

  <!-- FOOTER -->
  <footer class="w-full bg-white border-t border-slate-200 py-4 text-center text-xs font-bold text-slate-600" x-text="t('home.footer')">
  </footer>

  <!-- Alpine App Logic -->
  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('portalHubApp', () => ({
        state: PortalCore.getState(),
        currentLang: OctoI18n.currentLang,
        languages: OctoI18n.languages,

        curriculum: {
          foundational: [],
          enrichment: [],
          quickPractice: []
        },
        isLoadingCurriculum: true,
        loadError: false,
        loadErrorMessage: '',

        renderErrorState() {
          return window.OctoNotify ? OctoNotify.renderErrorCard({
            error: this.loadErrorMessage,
            retryFnName: 'window.location.reload()',
            backUrl: 'index.html'
          }) : '';
        },

        t(key, defaultVal) {
          return OctoI18n.t(key, defaultVal);
        },

        getLocalized(obj) {
          return OctoI18n.getLangText(obj, this.currentLang);
        },

        getLangText(obj) {
          return OctoI18n.getLangText(obj, this.currentLang);
        },

        get sortedFoundational() {
          if (!this.curriculum || !this.curriculum.foundational) return [];
          return [...this.curriculum.foundational].sort((a, b) => ((a.difficulty || 1) - (b.difficulty || 1)));
        },

        getQuickSubtitle(item) {
          if (item && item.subtitle) return this.getLocalized(item.subtitle);
          const subMap = {
            'quick-daily': this.t('curriculum.quickDailySub'),
            'quick-tryhard': this.t('curriculum.quickTryhardSub'),
            'quick-10': this.t('curriculum.quick10Sub'),
            'quick-20': this.t('curriculum.quick20Sub')
          };
          return subMap[item.id] || (item.questionCount ? this.t('curriculum.questionsCount').replace('{count}', item.questionCount) : '');
        },

        studentProfile: null,
        activeClassId: (window.PortalCore && PortalCore.getActiveClassId) ? PortalCore.getActiveClassId() : 'class-math',

        switchClass(classId) {
          if (!classId || classId === this.activeClassId) return;
          this.activeClassId = classId;
          if (window.PortalCore && PortalCore.setActiveClassId) {
            PortalCore.setActiveClassId(classId);
          }
          this.loadCurriculum();
          if (window.PortalCore) PortalCore.playPop();
        },

        getActiveClassObj() {
          const list = (window.PortalCore && PortalCore.availableClasses) ? PortalCore.availableClasses : [];
          return list.find(c => c.id === this.activeClassId) || list[0] || { id: 'class-math', name: { vi: 'Toán TIMO' }, icon: '📐' };
        },

        getActiveClassIcon() {
          return this.getActiveClassObj().icon;
        },

        getActiveClassName() {
          const c = this.getActiveClassObj();
          return this.getLocalized(c.name);
        },

        getAvailableClassesForStudent() {
          const all = (window.PortalCore && PortalCore.availableClasses) ? PortalCore.availableClasses : [];
          if (this.studentProfile && this.studentProfile.identity && Array.isArray(this.studentProfile.identity.classes) && this.studentProfile.identity.classes.length > 0) {
            const studentClasses = this.studentProfile.identity.classes;
            return all.filter(c => studentClasses.includes(c.id));
          }
          return all;
        },

        updateProfile() {
          const student = PortalCore.getStudent();
          this.studentProfile = (student && student.studentId) ? PortalCore.getFullProfile(student.studentId) : null;
          if (window.PortalCore && PortalCore.getActiveClassId) {
            const validActive = PortalCore.getActiveClassId();
            if (this.activeClassId !== validActive) {
              this.activeClassId = validActive;
              this.loadCurriculum();
            }
          }
        },

        getExamStatus(examId) {
          if (!this.studentProfile) return null;
          const currentList = this.studentProfile[this.activeClassId];
          if (Array.isArray(currentList)) {
            if (examId === 'quick-tryhard') {
              return currentList.find(item => item.examId && item.examId.includes('quick-tryhard')) || null;
            }
            return currentList.find(item => item.examId === examId) || null;
          }
          if (this.studentProfile.examList) {
            return this.studentProfile.examList[examId] || null;
          }
          return null;
        },

        getExamUrl(item, mode = 'practice') {
          if (!item) return 'modules/luyen-thi-trac-nghiem.html';
          const examId = item.id || 'timo-to-hop-g1';
          let dataFile = item.dataFile || 'assets/data/exams/timo-to-hop-g1.json';
          if (examId === 'quick-tryhard') {
            const student = PortalCore.getStudent();
            if (student && student.studentId) {
              dataFile = `assets/data/tryhard/${student.studentId}-${this.activeClassId}-quick-tryhard.json`;
            } else {
              dataFile = 'assets/data/tryhard/quick-tryhard.json';
            }
          }
          return `modules/luyen-thi-trac-nghiem.html?exam=${encodeURIComponent(examId)}&data=${encodeURIComponent(dataFile)}&mode=${encodeURIComponent(mode)}&class=${encodeURIComponent(this.activeClassId)}`;
        },

        startExam(item, mode = 'practice') {
          if (item && item.id && window.PortalCore && PortalCore.isLoggedIn()) {
            PortalCore.recordExamStart(item.id, mode, this.activeClassId);
          }
          PortalCore.playPop();
        },

        getThemeClasses(colorTheme) {
          const map = {
            emerald: {
              card: 'bg-emerald-50/70 border-emerald-300',
              badge: 'bg-emerald-100 text-emerald-800 border-emerald-300',
              exploreBtn: 'bg-white hover:bg-emerald-100 text-emerald-800 border-emerald-300',
              practiceBtn: 'bg-emerald-600 hover:bg-emerald-700'
            },
            amber: {
              card: 'bg-amber-50/70 border-amber-300',
              badge: 'bg-amber-100 text-amber-900 border-amber-300',
              exploreBtn: 'bg-white hover:bg-amber-100 text-amber-900 border-amber-300',
              practiceBtn: 'bg-amber-500 hover:bg-amber-600'
            },
            sky: {
              card: 'bg-sky-50/70 border-sky-300',
              badge: 'bg-sky-100 text-sky-800 border-sky-300',
              exploreBtn: 'bg-white hover:bg-sky-100 text-sky-800 border-sky-300',
              practiceBtn: 'bg-sky-600 hover:bg-sky-700'
            },
            purple: {
              card: 'bg-purple-50/70 border-purple-300',
              badge: 'bg-purple-100 text-purple-800 border-purple-300',
              exploreBtn: 'bg-white hover:bg-purple-100 text-purple-800 border-purple-300',
              practiceBtn: 'bg-purple-600 hover:bg-purple-700'
            },
            rose: {
              card: 'bg-rose-50/70 border-rose-300',
              badge: 'bg-rose-100 text-rose-800 border-rose-300',
              exploreBtn: 'bg-white hover:bg-rose-100 text-rose-800 border-rose-300',
              practiceBtn: 'bg-rose-500 hover:bg-rose-600'
            },
            teal: {
              card: 'bg-teal-50/70 border-teal-300',
              badge: 'bg-teal-100 text-teal-800 border-teal-300',
              exploreBtn: 'bg-white hover:bg-teal-100 text-teal-800 border-teal-300',
              practiceBtn: 'bg-teal-600 hover:bg-teal-700'
            }
          };
          return map[colorTheme] || map.purple;
        },

        getQuickThemeClasses(colorTheme) {
          const map = {
            purple: {
              card: 'bg-purple-50/80 border-purple-300 hover:border-purple-500',
              iconBox: 'bg-purple-600 text-white',
              title: 'group-hover:text-purple-700',
              arrow: 'text-purple-600'
            },
            sky: {
              card: 'bg-sky-50/80 border-sky-300 hover:border-sky-500',
              iconBox: 'bg-sky-600 text-white',
              title: 'group-hover:text-sky-700',
              arrow: 'text-sky-600'
            },
            emerald: {
              card: 'bg-emerald-50/80 border-emerald-300 hover:border-emerald-500',
              iconBox: 'bg-emerald-600 text-white',
              title: 'group-hover:text-emerald-700',
              arrow: 'text-emerald-600'
            },
            amber: {
              card: 'bg-amber-50/80 border-amber-300 hover:border-amber-500',
              iconBox: 'bg-amber-500 text-white',
              title: 'group-hover:text-amber-700',
              arrow: 'text-amber-600'
            }
          };
          return map[colorTheme] || map.purple;
        },

        async loadCurriculum() {
          this.isLoadingCurriculum = true;
          this.loadError = false;
          this.loadErrorMessage = '';
          const targetClass = this.activeClassId || 'class-math';
          const paths = [
            `assets/data/classes/${targetClass}.json`,
            `assets/data/classes/class-default.json`
          ];

          let loaded = false;
          let lastErr = null;

          for (const path of paths) {
            try {
              const res = await fetch(path);
              if (res.ok) {
                const data = await res.json();
                if (data && data.curriculum) {
                  this.curriculum = data.curriculum;
                  loaded = true;
                  break;
                }
              }
            } catch (e) {
              lastErr = e;
            }
          }

          if (!loaded) {
            console.error('Lỗi nạp danh mục đề thi:', lastErr);
            this.loadError = true;
            this.loadErrorMessage = `Không thể nạp tệp bài tập lớp "assets/data/classes/${targetClass}.json". Vui lòng kiểm tra lại!`;
          }
          this.isLoadingCurriculum = false;
        },

        setLang(code) {
          OctoI18n.setLanguage(code);
          this.currentLang = code;
          PortalCore.playPop();
        },

        getCurrentLangFlag() {
          const l = this.languages.find(item => item.code === this.currentLang);
          return l ? l.flag : '🌐';
        },

        getCurrentLangLabel() {
          const l = this.languages.find(item => item.code === this.currentLang);
          return l ? l.label : 'Tiếng Việt';
        },

        init() {
          window.addEventListener('octo-lang-changed', (e) => {
            this.currentLang = e.detail;
          });
          window.addEventListener('octo-student-changed', (e) => {
            this.state = PortalCore.getState();
            this.updateProfile();
          });
          window.addEventListener('octo-class-changed', (e) => {
            this.activeClassId = (e.detail && e.detail.classId) || PortalCore.getActiveClassId();
            this.loadCurriculum();
          });
          window.addEventListener('octo-profile-updated', (e) => {
            this.studentProfile = e.detail;
          });
          this.updateProfile();
          this.loadCurriculum();
        },

        openProfileModal() {
          if (window.OctoAuthModal) {
            OctoAuthModal.open({
              title: this.t('home.editProfileTitle', 'HỒ SƠ HỌC SINH & ĐĂNG NHẬP'),
              submitBtnText: this.t('home.saveProfileBtn', 'Lưu Thông Tin ✨'),
              showLogout: true,
              onSuccess: (student) => {
                this.state = PortalCore.getState();
                this.updateProfile();
              },
              onLogout: () => {
                this.state = PortalCore.getState();
                this.updateProfile();
              }
            });
          }
        }
      }));
    });
  </script>

</body>
</html>
